name: Stigen release

on:
  push:
    tags:
      - "v*.*.*-stigen.*"

permissions:
  contents: read

concurrency:
  group: stigen-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/stigenai/polis
  RELEASE_BRANCH: codex/hardened-v26.2.0

jobs:
  verify:
    name: Test and scan release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18.3
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.6-alpine
        ports:
          - 6379:6379
      mongo:
        image: mongo:8.2.6
        ports:
          - 27017:27017
      mysql:
        image: mysql:9.6.0
        ports:
          - 3307:3306
        env:
          MYSQL_DATABASE: mysql
          MYSQL_ROOT_PASSWORD: mysql
      maria:
        image: mariadb:12.2.2
        ports:
          - 3306:3306
        env:
          MARIADB_DATABASE: mysql
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
      mssql:
        image: mcr.microsoft.com/mssql/server:2025-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: "Y"
          SA_PASSWORD: "123ABabc!"
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an immutable Stigen tag on the maintained release branch
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-stigen\.[0-9]+$ ]]
          git fetch --no-tags origin "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/${RELEASE_BRANCH}"

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5c18fc1e60916d79a0d468d2437a2d4c # v6.1.0
        with:
          node-version: "24.17.0"
          cache: npm

      - name: Start CockroachDB test dependency
        uses: isbang/compose-action@4894d2492015c1774ee5a13a95b1072093087ec3 # v2.5.0
        with:
          compose-file: ./_dev/docker-compose-cockroachdb.yml

      - name: Install, audit, type-check, and test
        run: |
          npm ci --legacy-peer-deps
          npm audit --omit=dev --audit-level=high
          npm run check-types
          npm --prefix npm test -- --jobs=1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build an amd64 candidate for runtime verification
        shell: bash
        run: |
          set -euo pipefail
          build_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          docker buildx build --file Dockerfile.stigen --platform linux/amd64 --load --build-arg "VERSION=${GITHUB_REF_NAME}" --build-arg "COMMIT=${GITHUB_SHA}" --build-arg "BUILD_DATE=${build_date}" --tag polis:release-candidate .

      - name: Verify runtime identity and metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(docker image inspect polis:release-candidate --format '{{.Config.User}}')" == "10000:10000" ]]
          [[ "$(docker image inspect polis:release-candidate --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$GITHUB_SHA" ]]

      - name: Verify SQLite migrations complete
        shell: bash
        run: |
          set -euo pipefail
          migration_log="${RUNNER_TEMP}/polis-sqlite-migration.log"
          if ! timeout 60s docker run --rm \
            -e JACKSON_API_KEYS=release-smoke \
            -e DB_ENGINE=sql \
            -e DB_TYPE=sqlite \
            -e DB_URL=/tmp/polis.sqlite \
            --entrypoint /app/migrate.sh \
            polis:release-candidate >"$migration_log" 2>&1; then
            cat "$migration_log"
            exit 1
          fi
          grep -F 'Migration Finished' "$migration_log"

      - name: Verify HTTP readiness
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name polis-smoke -p 127.0.0.1::5225 \
            -e JACKSON_API_KEYS=release-smoke \
            -e DB_ENGINE=sql \
            -e DB_TYPE=sqlite \
            -e DB_URL=/tmp/polis.sqlite \
            --entrypoint /bin/sh \
            polis:release-candidate -c '/app/migrate.sh && exec node server.js'
          trap 'docker rm -f polis-smoke >/dev/null 2>&1 || true' EXIT
          port="$(docker port polis-smoke 5225/tcp | awk -F: '{print $NF}')"
          for _ in {1..30}; do
            if curl --fail --silent --show-error "http://127.0.0.1:${port}/api/health" | grep -F '"version"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs polis-smoke
          exit 1

      - name: Reject fixed high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: polis:release-candidate
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  publish:
    name: Publish, attest, and release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Recheck release source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-stigen\.[0-9]+$ ]]
          git fetch --no-tags origin "${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"
          git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/${RELEASE_BRANCH}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce immutable release tags
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error title=Immutable tag already exists::${IMAGE}:${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Resolve reproducible build date
        id: source
        shell: bash
        run: echo "created=$(git show -s --format=%cI "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-architecture candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.stigen
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.source.outputs.created }}
          provenance: mode=max
          sbom: true

      - name: Scan the published digest before promotion
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/polis.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign digest and attach the SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign attest --yes --predicate "${RUNNER_TEMP}/polis.spdx.json" --type spdxjson "${IMAGE}@${DIGEST}"
          identity='^https://github\.com/stigenai/polis/\.github/workflows/stigen-release\.yml@refs/tags/'
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com "${IMAGE}@${DIGEST}" >/dev/null
          cosign verify-attestation --certificate-identity-regexp "$identity" --certificate-oidc-issuer https://token.actions.githubusercontent.com --type spdxjson "${IMAGE}@${DIGEST}" >/dev/null

      - name: Record GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Promote the verified digest to the immutable release tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:${GITHUB_REF_NAME}" "${IMAGE}@${DIGEST}"
          promoted="sha256:$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_REF_NAME}" --raw | sha256sum | awk '{print $1}')"
          [[ "$promoted" == "$DIGEST" ]]

      - name: Create GitHub release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Polis ${GITHUB_REF_NAME}" --notes "Stigen-maintained Ory Polis v26.2.0 with refreshed production dependencies, reproducible clean installs, and a pinned non-root runtime. Multi-architecture image: ${IMAGE}@${DIGEST}. The digest is migration-, readiness-, and vulnerability-gated, keylessly signed, and carries build provenance and an SPDX SBOM." "${RUNNER_TEMP}/polis.spdx.json"
